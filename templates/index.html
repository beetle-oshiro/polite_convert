<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>文章校正システム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="form-container">

        <h1>文章校正システム</h1>

        <p class="page-description">
            入力した文章を用途に合わせて自然な表現に整えます。
        </p>

        <div class="input-card">
            <form method="POST" action="/">
                <div class="input-group">
                    <label for="text">校正したい文章</label>
                    <textarea id="text" name="text" rows="6">{{ original_text }}</textarea>
                </div>

                <div class="input-group">
                    <label for="style">変換スタイル</label>
                    <select id="style" name="style">
                        <option value="business" {{ 'selected' if selected_style=='business' else '' }}>ビジネス（上司・取引先向け）</option>
                        <option value="polite" {{ 'selected' if selected_style=='polite' else '' }}>丁寧（正しい日本語）</option>
                        <option value="casual" {{ 'selected' if selected_style=='casual' else '' }}>カジュアル（フレンドリー）</option>
                        <option value="youth" {{ 'selected' if selected_style=='youth' else '' }}>ユース（若者・流行語）</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">AIで文章を整える</button>
            </form>
        </div>

        {% if converted_text %}
        <div class="result-box">
            <h2>変換結果</h2>
            <p class="result-text">{{ converted_text }}</p>
        </div>
        {% endif %}

    </div>
</body>

</html>
